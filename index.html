<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090f">
<title>plainkit · čoskoro</title>
<meta name="description" content="plainkit — jednoduché nástroje bez reklám, bez registrácie, bez sledovania. Čoskoro spustené.">

<meta property="og:title" content="plainkit">
<meta property="og:description" content="Jednoduché nástroje bez reklám. Čoskoro.">
<meta property="og:image" content="https://plainkit.app/og-image.png">
<meta property="og:type" content="website">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2307090f'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia,serif' font-size='62' font-style='italic' font-weight='600' fill='%2300d4e8'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0f14;
    --bg2: #11171f;
    --accent: #00d4e8;
    --accent-dim: rgba(0,212,232,0.13);
    --text: #f5f7fa;
    --text-2: #8b95a3;
    --text-3: #4a5260;
    --border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* atmosférické pozadie */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%, var(--accent-dim), transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.4rem;
    animation-delay: 0.05s;
  }
  .logo {
    font-size: clamp(3.2rem, 12vw, 6rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 1.2rem;
  }
  .logo .dot { color: var(--accent); }
  .tagline {
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    color: var(--text-2);
    font-weight: 300;
    max-width: 30ch;
    margin: 0 auto 2.6rem;
    line-height: 1.6;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--text);
    padding: 0.7rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 100px;
    background: rgba(255,255,255,0.02);
  }
  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,212,232,0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(0,212,232,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,212,232,0); }
  }
  .links {
    margin-top: 2.4rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-2);
    text-decoration: none;
    padding: 0.55rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.25s ease;
  }
  .links a:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .foot {
    position: absolute;
    bottom: 1.6rem;
    left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-3);
    letter-spacing: 0.1em;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">no ads · no signup · no tracking</div>
    <div class="logo">plainkit<span class="dot">.</span></div>
    <div class="tagline">Jednoduché nástroje bez reklám, bez registrácie, bez sledovania.</div>
    <div class="status">
      <span class="pulse"></span>
      Domovská stránka čoskoro
    </div>
    <div class="links">
      <a href="/preklad">Prekladač →</a>
    </div>
  </div>
  <div class="foot">plainkit.app</div>
</body>
</html>
