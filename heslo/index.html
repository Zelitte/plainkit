<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plainkit. — sila hesla</title>
<meta name="description" content="Offline audit sily hesla. Nič sa nikam neposiela — celý výpočet beží v tvojom prehliadači.">

<!-- Samohostené fonty. Cesty over po nahratí do repa; názvy a fallbacky držia plainkit štandard. -->
<style>
@font-face{
  font-family:'Inter';
  src:url('/fonts/Inter-Variable.woff2') format('woff2');
  font-weight:100 900;font-display:swap;font-style:normal;
}
@font-face{
  font-family:'JetBrains Mono';
  src:url('/fonts/JetBrainsMono-Variable.woff2') format('woff2');
  font-weight:100 800;font-display:swap;font-style:normal;
}

:root{
  --bg:#07090f;
  --bg-2:#0a0f14;
  --panel:#0d141c;
  --line:#1b2733;
  --line-2:#243443;
  --ink:#e6edf3;
  --ink-dim:#7d93a6;
  --ink-faint:#4a5b6b;
  --cyan:#00d4e8;
  --yellow:#ffc629;
  --red:#ff4d5e;
  --orange:#ff8a3d;
  --green:#34e29b;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 500px at 78% -8%, rgba(0,212,232,.06), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment:fixed;
}

.wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}

/* ── hlavička ───────────────────────────── */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
a.brand{
  font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:-.5px;
  color:var(--ink);text-decoration:none;transition:opacity .15s;
}
a.brand:hover{opacity:.8}
a.brand b{color:var(--cyan)}
a.brand:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:3px}

.head-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.banner{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-faint)}
.banner span{color:var(--ink-dim)}

.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg-2)}
.lang button{
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  background:transparent;border:none;color:var(--ink-faint);
  padding:5px 10px;border-radius:999px;cursor:pointer;transition:color .15s,background .15s;
}
.lang button:hover{color:var(--ink-dim)}
.lang button.on{background:var(--cyan);color:#04141a;font-weight:700}
.lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}

h1{font-size:clamp(27px,7vw,42px);font-weight:800;letter-spacing:-.03em;margin:24px 0 8px;line-height:1.05}
h1 .accent{color:var(--cyan)}
.lede{color:var(--ink-dim);font-size:15px;max-width:54ch;margin-bottom:6px}

.offline-proof{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:12px;color:var(--green);
  border:1px solid rgba(52,226,155,.28);border-radius:999px;
  padding:6px 13px;margin:18px 0 4px;background:rgba(52,226,155,.05);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

/* ── vstup ──────────────────────────────── */
.field{margin-top:24px;position:relative}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:9px}
.input-row{display:flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--bg-2);transition:border-color .18s,box-shadow .18s}
.input-row:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,232,.1)}
#pw{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:18px;padding:16px;letter-spacing:.02em;min-width:0}
#pw::placeholder{color:var(--ink-faint)}
.reveal{background:transparent;border:none;border-left:1px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;padding:0 16px;cursor:pointer;letter-spacing:.05em;transition:color .15s;white-space:nowrap}
.reveal:hover{color:var(--cyan)}
.reveal:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}

/* ── meter ──────────────────────────────── */
.meter-card{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--bg-2));padding:22px;opacity:.4;transition:opacity .3s}
.meter-card.live{opacity:1}
.meter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.verdict{font-size:24px;font-weight:800;letter-spacing:-.02em;transition:color .25s}
.verdict-sub{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:3px}
.score-badge{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-faint);text-align:right;white-space:nowrap}
.score-badge b{display:block;font-size:13px}
.bar{display:flex;gap:5px;margin-bottom:20px}
.seg{flex:1;height:7px;border-radius:3px;background:var(--line);transition:background .25s,box-shadow .25s}
.crack{font-family:var(--mono);border-top:1px solid var(--line);padding-top:16px}
.crack-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.crack-time{font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.crack-ctx{font-size:11px;color:var(--ink-faint);margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.fact{background:var(--bg-2);padding:14px 13px}
.fact .k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.fact .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.fact .v small{font-size:11px;color:var(--ink-dim);font-weight:400}
.findings{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.finding{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2)}
.finding .ic{font-family:var(--mono);font-weight:700;flex-shrink:0;line-height:1.5}
.finding.warn{border-color:rgba(255,77,94,.3);background:rgba(255,77,94,.06)}
.finding.warn .ic{color:var(--red)}
.finding.note{border-color:rgba(255,198,41,.28);background:rgba(255,198,41,.05)}
.finding.note .ic{color:var(--yellow)}
.finding.good{border-color:rgba(52,226,155,.28);background:rgba(52,226,155,.05)}
.finding.good .ic{color:var(--green)}
.finding b{color:var(--ink)}

/* ── kontrola únikov (opt-in, HIBP) ─────── */
.breach{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:18px;opacity:.4;transition:opacity .3s}
.breach.live{opacity:1}
.breach-disclose{
  display:flex;gap:10px;align-items:flex-start;
  font-size:12px;line-height:1.5;color:var(--ink-dim);
  border:1px solid rgba(255,198,41,.28);background:rgba(255,198,41,.05);
  border-radius:10px;padding:11px 13px;margin-bottom:14px;
}
.breach-disclose .ic{color:var(--yellow);font-family:var(--mono);font-weight:700;flex-shrink:0}
.breach-disclose b{color:var(--ink)}
.breach-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
  font-family:var(--mono);font-size:13px;letter-spacing:.04em;
  background:transparent;color:var(--cyan);border:1px solid var(--line-2);
  border-radius:10px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s,color .15s;
}
.breach-btn:hover:not(:disabled){border-color:var(--cyan);background:rgba(0,212,232,.06)}
.breach-btn:disabled{opacity:.5;cursor:not-allowed}
.breach-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.breach-result{margin-top:14px;font-family:var(--mono);font-size:13px;display:none}
.breach-result.show{display:block}
.breach-result .line{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.breach-result.found .line{border-color:rgba(255,77,94,.35);background:rgba(255,77,94,.07);color:var(--ink)}
.breach-result.clean .line{border-color:rgba(52,226,155,.3);background:rgba(52,226,155,.06);color:var(--ink)}
.breach-result.err .line{border-color:var(--line-2);background:var(--bg);color:var(--ink-dim)}
.breach-result .ic{font-weight:700;flex-shrink:0}
.breach-result.found .ic{color:var(--red)}
.breach-result.clean .ic{color:var(--green)}
.breach-result b{color:var(--ink)}
.breach-sent{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:10px;word-break:break-all}
.breach-sent b{color:var(--ink-dim)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.notes{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.notes h2{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin-bottom:14px}
.notes p{font-size:13px;color:var(--ink-dim);margin-bottom:12px;max-width:62ch}
.notes p b{color:var(--ink)}
.notes code{font-family:var(--mono);font-size:12px;color:var(--cyan);background:var(--bg-2);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.notes a{color:var(--cyan);text-decoration:none}
.notes a:hover{text-decoration:underline}

footer{margin-top:40px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.8}
footer a{color:var(--ink-dim);text-decoration:none}
footer a:hover{color:var(--cyan)}

@media (max-width:560px){
  .wrap{padding:18px 14px 70px}
  .head-right{width:100%;margin-left:0;justify-content:space-between;order:3}
  .banner{display:none}
  header{gap:10px}
  .facts{grid-template-columns:1fr 1fr}
  .meter-top{flex-direction:column;align-items:flex-start;gap:8px}
  .score-badge{text-align:left}
  .meter-card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      uChars:"caractères", uBits:"bits",
      nH:"Comment ça marche (et ses limites)",
      n1:"<b>Rien ne quitte votre navigateur.</b> Tout le calcul se fait en JavaScript sur cette page. Aucun envoi au serveur, aucun tiers. Vérifiez-le : <code>DevTools → Network</code> reste vide pendant la saisie.",
      n2:"<b>C'est une estimation, pas une garantie.</b> La force est calculée à partir de la longueur, de l'alphabet utilisé et des schémas courants (mots du dictionnaire, répétitions, séquences clavier, années). Un attaquant réel peut être plus rapide ou plus lent — considérez ceci comme un ordre de grandeur, pas une promesse.",
      n3:"<b>Ce qu'il ne vérifie pas :</b> si le mot de passe est apparu dans une fuite de données. Cela nécessiterait une requête vers un service externe — et plainkit n'appelle volontairement aucun tiers. Vérifiez les fuites directement sur <a href=\"https://haveibeenpwned.com\">haveibeenpwned.com</a>.",
      fPriv:"confidentialité", fTag:"sans pub · sans compte · sans pistage",
      bDisclose:"<b>C'est la seule fonction qui contacte un service externe.</b> En cliquant, seuls les <b>5 premiers caractères</b> de l'empreinte SHA-1 de votre mot de passe sont envoyés à la base Have I Been Pwned — jamais le mot de passe ni l'empreinte complète. HIBP ne sait pas quel mot de passe vous testez. Le score de force ci-dessus est calculé entièrement hors ligne ; cette requête unique n'a lieu que si vous la déclenchez.",
      bBtn:"Vérifier dans les fuites (envoie 5 caractères du hash)",
      bChecking:"vérification…",
      bFound:"Ce mot de passe a été trouvé dans des fuites — vu <b>{n}×</b>. Ne l'utilisez pas.",
      bClean:"Ce mot de passe n'a <b>pas été trouvé</b> dans les fuites connues. (Cela ne le rend pas fort — voir le score ci-dessus.)",
      bErr:"Impossible de terminer la vérification (réseau ou service indisponible). Réessayez plus tard ou vérifiez directement sur haveibeenpwned.com.",
      bSent:"Envoyé à api.pwnedpasswords.com : <b>{p}</b> — 5 premiers caractères du hash, rien de plus.",
      verdicts:["Très faible","Faible","Correct","Fort","Très fort"],
      subs:["se casse presque instantanément","ne résiste qu'un instant","utilisable, mais pas pour les comptes importants","un bon choix pour la plupart des comptes","résiste même à une attaque persistante"],
      instant:"instantanément",
      time:["secondes","minutes","heures","jours","ans","siècles","millénaires","millions d'années"],
      find:{
        common:"Contient un mot courant ou un mot de passe connu — les attaquants les essaient en premier.",
        keyboard:"Contient une séquence clavier (par ex. « qwerty », « 12345 »).",
        repeat:"Les caractères répétés (par ex. « aaaa ») ajoutent moins de force qu'il n'y paraît.",
        seq:"Une séquence numérique est facile à deviner.",
        year:"Ressemble à une année — les dates sont parmi les premières devinées.",
        digits:"Que des chiffres — ajoutez des lettres et des symboles.",
        short:"Moins de 8 caractères se casse très vite.",
        longGood:"Belle longueur — la longueur aide plus que la complexité.",
        mixGood:"Mélange majuscules/minuscules, chiffres et symboles sans schéma évident."
      }
    }
  };

  var lang = 'sk';

  var pw = document.getElementById('pw');
  var reveal = document.getElementById('reveal');
  var card = document.getElementById('card');
  var verdict = document.getElementById('verdict');
  var verdictSub = document.getElementById('verdictSub');
  var scoreNum = document.getElementById('scoreNum');
  var bar = document.getElementById('bar');
  var segs = bar.querySelectorAll('.seg');
  var crackTime = document.getElementById('crackTime');
  var fLen = document.getElementById('fLen');
  var fEnt = document.getElementById('fEnt');
  var fPool = document.getElementById('fPool');
  var findings = document.getElementById('findings');
  var breach = document.getElementById('breach');
  var breachBtn = document.getElementById('breachBtn');
  var breachResult = document.getElementById('breachResult');
  var breachSent = document.getElementById('breachSent');

  var GUESSES_PER_SEC = 1e10;

  var COMMON = ['password','heslo','123456','12345678','qwerty','111111','123123',
    'admin','letmein','welcome','monkey','dragon','iloveyou','login','abc123',
    'football','starwars','master','sunshine','princess','azerty','qwertz',
    'slovensko','bratislava','milujem','ahoj','test','root','user','motdepasse'];
  var KEYBOARD = ['qwertz','qwerty','azerty','asdfgh','yxcvbn','zxcvbn','12345','123456','1234567890','poiuyt'];

  function poolSize(s){
    var pool = 0;
    if(/[a-z]/.test(s)) pool += 26;
    if(/[A-Z]/.test(s)) pool += 26;
    if(/[0-9]/.test(s)) pool += 10;
    if(/[^a-zA-Z0-9]/.test(s)) pool += 33;
    if(/[^\x00-\x7F]/.test(s)) pool += 40;
    return pool || 1;
  }

  function analyze(s){
    var len = s.length;
    var pool = poolSize(s);
    var lower = s.toLowerCase();
    var f = T[lang].find;
    var notes = [];
    var penaltyBits = 0;

    var isCommon = false;
    for(var i=0;i<COMMON.length;i++){
      if(lower === COMMON[i] || lower.indexOf(COMMON[i]) !== -1){ isCommon = true; break; }
    }
    if(isCommon){ notes.push({t:'warn', x:f.common}); penaltyBits += 18; }

    for(var k=0;k<KEYBOARD.length;k++){
      if(lower.indexOf(KEYBOARD[k]) !== -1){ notes.push({t:'warn', x:f.keyboard}); penaltyBits += 12; break; }
    }
    if(/(.)\1{2,}/.test(s)){ notes.push({t:'note', x:f.repeat}); penaltyBits += 8; }
    if(/(012|123|234|345|456|567|678|789|987|876|765|654|543|432|321)/.test(s)){ notes.push({t:'note', x:f.seq}); penaltyBits += 6; }
    if(/(19|20)\d{2}/.test(s)){ notes.push({t:'note', x:f.year}); penaltyBits += 5; }
    if(/^\d+$/.test(s) && len>0){ notes.push({t:'note', x:f.digits}); }

    var rawBits = len > 0 ? len * (Math.log(pool)/Math.log(2)) : 0;
    var bits = Math.max(0, rawBits - penaltyBits);

    if(len >= 16 && !isCommon){ notes.push({t:'good', x:f.longGood}); }
    else if(len > 0 && len < 8){ notes.push({t:'warn', x:f.short}); }

    var classes = (/[a-z]/.test(s)?1:0)+(/[A-Z]/.test(s)?1:0)+(/[0-9]/.test(s)?1:0)+(/[^a-zA-Z0-9]/.test(s)?1:0);
    if(classes >= 3 && len >= 12 && !isCommon && penaltyBits===0){ notes.push({t:'good', x:f.mixGood}); }

    return {len:len, pool:pool, bits:bits, notes:notes};
  }

  function humanTime(seconds){
    var L = T[lang];
    if(seconds < 1) return L.instant;
    var thresholds = [60,60,24,365,100,1000,1000];
    var v = seconds, i = 0;
    while(i < thresholds.length && v >= thresholds[i]){ v = v / thresholds[i]; i++; }
    var name = (i < L.time.length-1) ? L.time[i] : L.time[L.time.length-1];
    if(name === L.time[6] && v > 1000){ v = v/1000; name = L.time[7]; }
    var locale = lang==='en'?'en-US':(lang==='fr'?'fr-FR':'sk-SK');
    var num;
    if(v >= 100) num = Math.round(v).toLocaleString(locale);
    else if(v >= 10) num = Math.round(v);
    else num = Math.round(v*10)/10;
    return num + ' ' + name;
  }

  var lastVal = '';

  function render(s){
    lastVal = s;
    var L = T[lang];
    if(s.length === 0){
      card.classList.remove('live');
      verdict.textContent='—'; verdict.style.color='var(--ink-faint)';
      verdictSub.textContent=L.waitSub;
      scoreNum.textContent='0 / 4';
      crackTime.textContent='—'; crackTime.style.color='var(--ink)';
      fLen.innerHTML='0 <small>'+L.uChars+'</small>';
      fEnt.innerHTML='0 <small>'+L.uBits+'</small>';
      fPool.innerHTML='0 <small>'+L.uChars+'</small>';
      segs.forEach(function(sg){sg.style.background='var(--line)';sg.style.boxShadow='none';});
      findings.innerHTML='';
      breach.classList.remove('live');
      breachBtn.disabled=true;
      resetBreach();
      return;
    }
    card.classList.add('live');
    var a = analyze(s);
    var bits = a.bits;
    var score, color;
    if(bits < 28){ score=0; color='var(--red)'; }
    else if(bits < 40){ score=1; color='var(--orange)'; }
    else if(bits < 60){ score=2; color='var(--yellow)'; }
    else if(bits < 80){ score=3; color='var(--cyan)'; }
    else { score=4; color='var(--green)'; }

    verdict.textContent=L.verdicts[score]; verdict.style.color=color;
    verdictSub.textContent=L.subs[score];
    scoreNum.textContent=score+' / 4';

    segs.forEach(function(sg,ix){
      if(ix < (score===0?0:score)){ sg.style.background=color; sg.style.boxShadow='0 0 8px '+color; }
      else { sg.style.background='var(--line)'; sg.style.boxShadow='none'; }
    });
    if(score===0){ segs[0].style.background=color; segs[0].style.boxShadow='none'; }

    var guesses = Math.pow(2, bits) / 2;
    var seconds = guesses / GUESSES_PER_SEC;
    crackTime.textContent = humanTime(seconds);
    crackTime.style.color = color;

    fLen.innerHTML = a.len + ' <small>'+L.uChars+'</small>';
    fEnt.innerHTML = Math.round(bits) + ' <small>'+L.uBits+'</small>';
    fPool.innerHTML = a.pool + ' <small>'+L.uChars+'</small>';

    var ics = {warn:'!', note:'~', good:'✓'};
    findings.innerHTML = a.notes.map(function(n){
      return '<div class="finding '+n.t+'"><span class="ic">'+ics[n.t]+'</span><span>'+n.x+'</span></div>';
    }).join('');

    breach.classList.add('live');
    breachBtn.disabled=false;
    resetBreach();
  }

  /* ── kontrola únikov (HIBP, opt-in) ───── */
  function resetBreach(){
    breachResult.className='breach-result';
    breachResult.innerHTML='';
    breachSent.innerHTML='';
    var L=T[lang];
    breachBtn.innerHTML = L.bBtn;
  }

  async function sha1Hex(str){
    var buf = new TextEncoder().encode(str);
    var digest = await crypto.subtle.digest('SHA-1', buf);
    var bytes = new Uint8Array(digest);
    var hex = '';
    for(var i=0;i<bytes.length;i++){ hex += bytes[i].toString(16).padStart(2,'0'); }
    return hex.toUpperCase();
  }

  async function checkBreach(){
    var L=T[lang];
    var pwd = pw.value;
    if(!pwd) return;
    breachBtn.disabled=true;
    breachBtn.innerHTML = '<span class="spin"></span> '+L.bChecking;
    breachResult.className='breach-result';
    breachResult.innerHTML='';
    breachSent.innerHTML='';
    try{
      var hash = await sha1Hex(pwd);
      var prefix = hash.slice(0,5);
      var suffix = hash.slice(5);
      // jediný externý request celého webu — k-anonymity, posiela sa len 5 znakov hashu
      var resp = await fetch('https://api.pwnedpasswords.com/range/'+prefix);
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      var text = await resp.text();
      var count = 0;
      var lines = text.split('\n');
      for(var i=0;i<lines.length;i++){
        var parts = lines[i].trim().split(':');
        if(parts[0] === suffix){ count = parseInt(parts[1],10)||0; break; }
      }
      if(count > 0){
        breachResult.className='breach-result show found';
        breachResult.innerHTML='<div class="line"><span class="ic">✕</span><span>'+L.bFound.replace('{n}', count.toLocaleString(lang==='en'?'en-US':(lang==='fr'?'fr-FR':'sk-SK')))+'</span></div>';
      } else {
        breachResult.className='breach-result show clean';
        breachResult.innerHTML='<div class="line"><span class="ic">✓</span><span>'+L.bClean+'</span></div>';
      }
      breachSent.innerHTML = L.bSent.replace('{p}', prefix);
    } catch(e){
      breachResult.className='breach-result show err';
      breachResult.innerHTML='<div class="line"><span class="ic">~</span><span>'+L.bErr+'</span></div>';
    }
    breachBtn.disabled=false;
    breachBtn.innerHTML = L.bBtn;
  }

  breachBtn.addEventListener('click', checkBreach);

  function applyLang(){
    var L = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(function(el){
      var key = el.getAttribute('data-i');
      if(L[key] !== undefined) el.innerHTML = L[key];
    });
    document.querySelector('h1').innerHTML = L.h1 + '<span class="accent">'+L.h1b+'</span>';
    pw.setAttribute('placeholder', L.ph);
    reveal.textContent = (pw.type === 'password') ? L.reveal : L.revealHide;
    if(breachBtn && !breachBtn.disabled) breachBtn.innerHTML = L.bBtn;
    render(lastVal);
  }

  pw.addEventListener('input', function(){ render(pw.value); });

  reveal.addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    reveal.textContent = show ? T[lang].revealHide : T[lang].reveal;
    reveal.setAttribute('aria-pressed', show ? 'true':'false');
    pw.focus();
  });

  document.querySelectorAll('.lang button').forEach(function(btn){
    btn.addEventListener('click', function(){
      lang = btn.getAttribute('data-lang');
      document.querySelectorAll('.lang button').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      applyLang();
    });
  });

  applyLang();
})();
</script>
</body>
</html>
