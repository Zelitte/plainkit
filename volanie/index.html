<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volanie — plainkit.</title>
<meta name="description" content="Falošný hovor od Ježiška alebo Bubáka. Bez reklám, bez registrácie, nahrávky ostávajú v zariadení.">
<meta name="theme-color" content="#0a0f14">
<link rel="manifest" href="/volanie/manifest.json">
<link rel="icon" href="/volanie/icon-192.png">
<link rel="apple-touch-icon" href="/volanie/icon-192.png">
<style>
/* TODO: sem skopíruj @font-face blok pre IBM Plex Sans z inej plainkit stránky (/fonts/) */
:root{--bg:#07090f;--bg2:#0a0f14;--card:#111823;--line:#1c2633;--tx:#e6edf3;--mut:#8b98a8;--cy:#00d4e8;--ye:#ffc629;--mg:#ff3df2;--ok:#2ecc71;--no:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
a{color:var(--cy)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{color:var(--tx);text-decoration:none;font-weight:700;font-size:20px}
.logo span{color:var(--cy)}
.lang{display:flex;gap:4px}
.lang button{background:none;border:1px solid var(--line);color:var(--mut);padding:4px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{border-color:var(--cy);color:var(--cy)}
.banner{text-align:center;font-size:12px;color:var(--mut);padding:6px 16px;letter-spacing:.04em}
main{max-width:480px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.big{display:block;width:100%;padding:22px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:20px;font-weight:600;cursor:pointer;text-align:left}
.big.j{border-color:var(--ye)}.big.b{border-color:var(--mg)}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:4px}
.slot{margin-bottom:18px}
.link{background:none;border:none;color:var(--cy);font:inherit;font-size:14px;padding:8px 2px;cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{flex:1;min-width:120px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.btn.pri{border-color:var(--cy);color:var(--cy)}
.btn.rec{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px}
.pitch{display:block;margin:14px 0 4px;font-size:14px;color:var(--mut)}.pitch b{color:var(--cy)}.pitch input{width:100%;margin-top:8px;accent-color:#00d4e8}.pl{display:flex;justify-content:space-between;font-size:12px}
.status{font-size:14px;min-height:20px;margin:6px 0;color:var(--ye)}
.delay{display:flex;gap:6px;margin:6px 0 18px}
.delay button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.delay button.on{border-color:var(--cy);color:var(--cy)}
/* celoobrazovkový hovor */
.phone{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#16202c,#05070b 70%);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(48px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));z-index:10;text-align:center}
.phone.on{display:flex}
.who{font-size:30px;font-weight:600}
.what{color:var(--mut);margin-top:6px;font-size:16px}
.ava{width:min(64vw,260px);height:min(64vw,260px)}
.ringing .ava{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ava .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ava .tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.2;transform:scale(.5)}}
.ava .pulse{animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
.acts{display:flex;justify-content:space-around;width:100%;max-width:340px}
.circ{width:72px;height:72px;border-radius:50%;border:none;font-size:30px;color:#fff;cursor:pointer}
.circ.ok{background:var(--ok)}.circ.no{background:var(--no)}
.lbl{font-size:13px;color:var(--mut);margin-top:6px}
.wait{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;color:#333;font-size:14px;gap:16px}
.wait.on{display:flex}
.wait button{background:none;border:1px solid #222;color:#444;padding:8px 14px;border-radius:8px;font:inherit}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">plainkit<span>.</span></a>
  <div class="lang"><button data-l="sk">SK</button><button data-l="en">EN</button></div>
</header>
<div class="banner">no ads · no signup · no tracking</div>

<main>
  <!-- VÝBER -->
  <section id="vHome" class="view on">
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="delay" id="delay">
      <button data-d="0" data-i18n="dNow"></button>
      <button data-d="10" class="on" data-i18n="d10"></button>
      <button data-d="30" data-i18n="d30"></button>
    </div>
    <div class="slot">
      <button class="big j" data-call="jezisko"><span data-i18n="callJ"></span><small data-i18n="callJs"></small></button>
      <button class="link" data-rec="jezisko" data-i18n="recOwn"></button> <span class="lbl" id="hasJ"></span>
    </div>
    <div class="slot">
      <button class="big b" data-call="bubak"><span data-i18n="callB"></span><small data-i18n="callBs"></small></button>
      <button class="link" data-rec="bubak" data-i18n="recOwn"></button> <span class="lbl" id="hasB"></span>
    </div>
    <p class="note" data-i18n="privacy"></p>
  </section>

  <!-- NAHRÁVANIE -->
  <section id="vRec" class="view">
    <h1 id="recTitle"></h1>
    <p class="sub" id="recTip"></p>
    <div class="status" id="recStatus"></div>
    <div class="row">
      <button class="btn rec" id="bRec" data-i18n="rec"></button>
      <button class="btn" id="bStop" disabled data-i18n="stop"></button>
    </div>
    <label class="pitch"><span data-i18n="pitch"></span> <b id="semiV"></b>
      <input type="range" id="semi" min="-10" max="10" step="1">
      <span class="pl"><span data-i18n="lower"></span><span data-i18n="higher"></span></span>
    </label>
    <div class="row">
      <button class="btn" id="bPlay" disabled data-i18n="play"></button>
      <button class="btn pri" id="bSave" disabled data-i18n="save"></button>
    </div>
    <div class="row">
      <button class="btn" id="bDel" data-i18n="del"></button>
      <button class="btn" id="bBack" data-i18n="back"></button>
    </div>
    <p class="note" data-i18n="recNote"></p>
  </section>
</main>

<!-- ČAKANIE (čierna obrazovka, telefón v ruke dieťaťa) -->
<div class="wait" id="vWait"><span data-i18n="waiting"></span><button id="bCancel" data-i18n="cancel"></button></div>

<!-- HOVOR -->
<div class="phone" id="vPhone">
  <div><div class="who" id="who"></div><div class="what" id="what"></div></div>
  <svg class="ava" id="ava" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <div class="acts" id="acts"></div>
</div>

<script>
'use strict';
const I18N={
sk:{title:'Zavolaj si',sub:'Ťukni, podaj telefón dieťaťu a o chvíľu zazvoní.',dNow:'Hneď',d10:'O 10 s',d30:'O 30 s',
callJ:'🎄 Zavolať Ježiškovi',callJs:'pre radosť',callB:'👹 Zavolať Bubákovi',callBs:'keď to doma vrie',
recOwn:'Nahrať vlastnú správu',hasOwn:'· vlastná správa ✓',
privacy:'Mikrofón sa použije len pri nahrávaní. Nahrávka sa upraví a uloží iba v tomto zariadení — nikam sa neposiela. Na iPhone vypni tichý režim, inak hovor nebude počuť.',
recJ:'Správa od Ježiška',recB:'Správa od Bubáka',
tipJ:'Oslov dieťa menom a povedz, čo konkrétne urobilo dobre. Hlas sa potom zmení na Ježiškov.',
tipB:'Pokojne, nie strašidelne: povedz, čo má dieťa urobiť („keď sa upokojíš, nemusím prísť"). Skonči vlídne.',
rec:'● Nahrať',stop:'■ Stop',play:'▶ Vypočuť',save:'Uložiť',del:'Zmazať uloženú',back:'Späť',
recNote:'Max. 60 sekúnd. Ak hlas stále znie ako ty, posuň výšku ďalej od nuly. Uloží sa tvoja pôvodná nahrávka — len v tomto zariadení, efekt sa pridá pri prehrávaní.',
recording:'Nahrávam…',recDone:'Hotovo. Vypočuj si a ulož.',saved:'Uložené ✓',deleted:'Zmazané.',noMic:'Mikrofón nie je dostupný alebo bol zamietnutý.',
waiting:'Hovor príde o chvíľu…',cancel:'Zrušiť',
nameJ:'Ježiško',nameB:'Bubák',incoming:'prichádzajúci hovor',accept:'Prijať',decline:'Odmietnuť',hang:'Zložiť',ended:'Hovor ukončený',
noMsg:'Najprv nahraj vlastnú správu.',pitch:'Výška hlasu:',lower:'hlbší',higher:'vyšší',st:'pol-tónov',working:'Upravujem hlas…'},
en:{title:'Make a call',sub:'Tap, hand the phone to your child and it rings shortly.',dNow:'Now',d10:'In 10 s',d30:'In 30 s',
callJ:'🎅 Call Santa',callJs:'just for fun',callB:'👹 Call the Bogeyman',callBs:'when things boil over',
recOwn:'Record your own message',hasOwn:'· own message ✓',
privacy:'The microphone is used only while recording. The recording is processed and stored on this device only — it is never sent anywhere. On iPhone turn off silent mode or the call will be mute.',
recJ:'Message from Santa',recB:'Message from the Bogeyman',
tipJ:'Say your child\'s name and what exactly they did well. The voice is then changed to Santa\'s.',
tipB:'Calm, not scary: say what the child should do ("once you calm down, I don\'t need to come"). End kindly.',
rec:'● Record',stop:'■ Stop',play:'▶ Listen',save:'Save',del:'Delete saved',back:'Back',
recNote:'Max 60 seconds. If it still sounds like you, move the pitch further from zero. Your original recording is stored — on this device only; the effect is applied on playback.',
recording:'Recording…',recDone:'Done. Listen and save.',saved:'Saved ✓',deleted:'Deleted.',noMic:'Microphone unavailable or permission denied.',
waiting:'The call is coming…',cancel:'Cancel',
nameJ:'Santa',nameB:'Bogeyman',incoming:'incoming call',accept:'Accept',decline:'Decline',hang:'Hang up',ended:'Call ended',
noMsg:'Record your own message first.',pitch:'Voice pitch:',lower:'deeper',higher:'higher',st:'semitones',working:'Processing voice…'}};

let lang=(()=>{try{const s=localStorage.getItem('pk-lang');if(s)return s}catch(e){}return /^(sk|cs)/i.test(navigator.language)?'sk':'en'})();
const $=s=>document.querySelector(s);
const t=k=>I18N[lang][k]||k;
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  refreshHas();
  if(recWho)syncSemi();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('pk-lang',lang)}catch(e){}applyLang()});

/* ---------- IndexedDB (len lokálne) ---------- */
const DB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((ok,ko)=>{const r=indexedDB.open('pk-volanie',1);r.onupgradeneeded=()=>r.result.createObjectStore('msg');r.onsuccess=()=>ok(this.db=r.result);r.onerror=()=>ko(r.error)})},
  async op(mode,fn){const d=await this.open();return new Promise((ok,ko)=>{const tx=d.transaction('msg',mode);const r=fn(tx.objectStore('msg'));tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error)})},
  get(k){return this.op('readonly',s=>s.get(k))},
  set(k,v){return this.op('readwrite',s=>s.put(v,k))},
  del(k){return this.op('readwrite',s=>s.delete(k))}};
async function refreshHas(){
  for(const [c,id] of [['jezisko','#hasJ'],['bubak','#hasB']]){
    let has=false;try{has=!!(await DB.get(c))}catch(e){}
    $(id).textContent=has?t('hasOwn'):'';
  }
}

/* ---------- Audio ---------- */
let ctx=null;
function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
// iOS: odomkni zvuk tichým tónom v rámci dotyku
function unlock(){const c=ac();const b=c.createBuffer(1,1,22050);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}

function impulse(c,sec,decay){const n=c.sampleRate*sec,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}

/* ---------- Zmena hlasu (lokálne, bez servera) ---------- */
// WSOLA time-stretch: zmení dĺžku bez zmeny výšky. stretch>1 = dlhšie.
function wsola(x,sr,stretch){
  const N=Math.round(sr*0.04)&~1, Hs=N>>1, Ha=Hs/stretch, tol=Math.round(sr*0.01);
  const outLen=Math.ceil(x.length*stretch)+N, y=new Float32Array(outLen), wsum=new Float32Array(outLen);
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  const L=Math.min(512,Hs), step=4;
  let prev=0; // pozícia v x, kde skončil predchádzajúci rámec (+Hs = prirodzené pokračovanie)
  for(let k=0,o=0;o+N<outLen;k++,o+=Hs){
    const target=Math.round(k*Ha);
    let best=target;
    if(k>0){
      const nat=prev+Hs;let bc=-Infinity;
      for(let d=-tol;d<=tol;d+=2){
        const p=target+d;if(p<0||p+N>x.length)continue;
        let c=0;for(let i=0;i<L;i+=step)c+=x[p+i]*x[nat+i]||0;
        if(c>bc){bc=c;best=p}
      }
    }
    if(best+N>x.length)break;
    for(let i=0;i<N;i++){y[o+i]+=x[best+i]*win[i];wsum[o+i]+=win[i]}
    prev=best;
  }
  for(let i=0;i<outLen;i++)if(wsum[i]>1e-3)y[i]/=wsum[i];
  return y.subarray(0,Math.ceil(x.length*stretch));
}
// Výška ×p (aj formanty → hlas prestane byť „tvoj"), tempo ×t. Vráti nové pole.
function shiftVoice(x,sr,semi,tempo){
  const p=Math.pow(2,semi/12), s=wsola(x,sr,p/tempo);
  const n=Math.floor(s.length/p), y=new Float32Array(n);
  for(let i=0;i<n;i++){const f=i*p,j=f|0,a=f-j;y[i]=(s[j]||0)*(1-a)+(s[j+1]||0)*a}
  return y;
}

// postava → predvolený posun (pol-tóny) a tempo. Ježiško = dieťa (vyšší), Santa a Bubák hlbší.
const VOICE={jezisko:{semi:5,tempo:1},santa:{semi:-4,tempo:0.92},bubak:{semi:-6,tempo:0.88}};
const charOf=slot=>slot==='jezisko'&&lang==='en'?'santa':slot;
function getSemi(ch){try{const v=localStorage.getItem('pk-vol-'+ch);if(v!==null&&!isNaN(+v))return +v}catch(e){}return VOICE[ch].semi}
function setSemi(ch,v){try{localStorage.setItem('pk-vol-'+ch,String(v))}catch(e){}}
function processVoice(buf,ch){
  const sr=buf.sampleRate,n=buf.length,x=new Float32Array(n);
  for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)x[i]+=d[i]/buf.numberOfChannels}
  const y=shiftVoice(x,sr,getSemi(ch),VOICE[ch].tempo);
  let pk=0;for(let i=0;i<y.length;i++)pk=Math.max(pk,Math.abs(y[i]));
  const g=pk>0?Math.min(4,0.9/pk):1;for(let i=0;i<y.length;i++)y[i]*=g;   // vyrovnaj hlasitosť
  const out=ac().createBuffer(1,y.length,sr);out.getChannelData(0).set(y);return out;
}
function growl(c){const ws=c.createWaveShaper(),k=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;k[i]=Math.tanh(2.2*x)}ws.curve=k;return ws}
// Farba hlasu po posune → vráti {src, analyser}
function voiceChain(buf,ch){
  const c=ac(),src=c.createBufferSource();src.buffer=buf;
  const out=c.createGain(),an=c.createAnalyser();an.fftSize=512;
  if(ch==='bubak'){
    const lo=c.createBiquadFilter();lo.type='lowshelf';lo.frequency.value=220;lo.gain.value=5;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    src.connect(lo).connect(growl(c)).connect(lp).connect(out);out.gain.value=0.8;   // mierne chrapľavý
  }else{
    const hs=c.createBiquadFilter();hs.type='highshelf';hs.frequency.value=5000;hs.gain.value=ch==='santa'?-5:-2;
    const dry=c.createGain(),wet=c.createGain(),cv=c.createConvolver();
    cv.buffer=impulse(c,ch==='santa'?1.2:2,3);dry.gain.value=0.85;wet.gain.value=ch==='santa'?0.2:0.35;
    src.connect(hs);hs.connect(dry).connect(out);hs.connect(cv).connect(wet).connect(out);
  }
  out.connect(an);an.connect(c.destination);
  return {src,an};
}

async function decodeBlob(blob){const ab=await blob.arrayBuffer();return await new Promise((ok,ko)=>ac().decodeAudioData(ab,ok,ko))}

async function loadMsg(who){
  try{const own=await DB.get(who);if(own)return await decodeBlob(own)}catch(e){}
  try{const r=await fetch(`/volanie/${who}-${lang}.mp3`);if(r.ok)return await decodeBlob(await r.blob())}catch(e){}
  return null;
}

/* ---------- Zvonenie (generované, žiadny súbor) ---------- */
let ringTimer=null,ringNodes=[];
function ringOnce(){
  const c=ac(),now=c.currentTime;
  [[0,0.4],[0.6,1.0]].forEach(([a,b])=>{
    [523,659].forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+a);g.gain.linearRampToValueAtTime(0.15,now+a+0.02);g.gain.setValueAtTime(0.15,now+b-0.03);g.gain.linearRampToValueAtTime(0,now+b);
      o.connect(g).connect(c.destination);o.start(now+a);o.stop(now+b+0.05);ringNodes.push(o)});
  });
  if(navigator.vibrate)navigator.vibrate([400,200,400]);
}
function startRing(){ringOnce();ringTimer=setInterval(ringOnce,3000)}
function stopRing(){clearInterval(ringTimer);ringTimer=null;ringNodes.forEach(o=>{try{o.stop()}catch(e){}});ringNodes=[];if(navigator.vibrate)navigator.vibrate(0)}

/* ---------- Postavičky (SVG, vlastné) ---------- */
const f1=n=>n.toFixed(1);
// chlpy/brada: kruhy po oblúku
const fl=(cx,cy,r,a0,a1,n,br,fill)=>Array.from({length:n},(_,i)=>{const a=a0+(a1-a0)*i/(n-1);return `<circle cx="${f1(cx+Math.cos(a)*r)}" cy="${f1(cy+Math.sin(a)*r)}" r="${br}" fill="${fill}"/>`}).join('');
const star=(cx,cy,ro,ri)=>'M'+Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5,r=i%2?ri:ro;return f1(cx+Math.cos(a)*r)+' '+f1(cy+Math.sin(a)*r)}).join(' L')+'Z';
const spark=(x,y,s,d)=>`<g transform="translate(${x} ${y}) scale(${s})"><path class="tw" style="animation-delay:${d}s" d="M0 -8Q1 -1 8 0Q1 1 0 8Q-1 1 -8 0Q-1 -1 0 -8Z" fill="#fff6d6"/></g>`;
const tufts=`<g fill="#45376a">${Array.from({length:44},(_,i)=>{const a=i/34*Math.PI*2,p=(r,d)=>f1(100+Math.cos(a+d)*r)+','+f1(110+Math.sin(a+d)*r);return `<polygon points="${p(74,-0.08)} ${p(84+(i%3)*3,0.02)} ${p(74,0.08)}"/>`}).join('')}</g>`;
const shadow='<ellipse cx="100" cy="190" rx="54" ry="6" fill="#000" opacity=".35"/>';
const AVA={
jezisko:`<defs>
<radialGradient id="jh"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset="1" stop-color="#ffc629" stop-opacity="0"/></radialGradient>
<radialGradient id="jg" cx=".45" cy=".4" r=".65"><stop offset="0" stop-color="#fff4c8"/><stop offset=".55" stop-color="#ffd24a"/><stop offset="1" stop-color="#f4a62a"/></radialGradient></defs>
<circle class="pulse" cx="100" cy="104" r="96" fill="url(#jh)"/>
<path d="${star(100,108,80,38)}" fill="url(#jg)" stroke="#f7b733" stroke-width="16" stroke-linejoin="round"/>

/* ---------- Tok hovoru ---------- */
let who=null,delay=10,waitT=null,lock=null,playing=null,raf=0,tick=0;
document.querySelectorAll('#delay button').forEach(b=>b.onclick=()=>{delay=+b.dataset.d;document.querySelectorAll('#delay button').forEach(x=>x.classList.toggle('on',x===b))});

async function wake(on){try{if(on&&'wakeLock' in navigator)lock=await navigator.wakeLock.request('screen');else if(lock){await lock.release();lock=null}}catch(e){}}

document.querySelectorAll('[data-call]').forEach(b=>b.onclick=async()=>{
  unlock();who=b.dataset.call;
  const buf=await loadMsg(who);
  if(!buf){alert(t('noMsg'));return}
  window._buf=processVoice(buf,charOf(who));
  await wake(true);
  if(delay===0){incoming();return}
  $('#vWait').classList.add('on');
  waitT=setTimeout(()=>{$('#vWait').classList.remove('on');incoming()},delay*1000);
});
$('#bCancel').onclick=()=>{clearTimeout(waitT);$('#vWait').classList.remove('on');wake(false)};

function setPhone(sub,acts){
  $('#who').textContent=t(who==='jezisko'?'nameJ':'nameB');
  $('#what').textContent=sub;$('#ava').innerHTML=AVA[who==='jezisko'&&lang==='en'?'santa':who];
  $('#acts').innerHTML=acts.map(([cls,ic,l,id])=>`<div><button class="circ ${cls}" id="${id}">${ic}</button><div class="lbl">${t(l)}</div></div>`).join('');
  $('#vPhone').classList.add('on');
}
function incoming(){
  $('#vPhone').classList.add('ringing');
  setPhone(t('incoming'),[['no','✕','decline','bNo'],['ok','✆','accept','bOk']]);
  startRing();
  $('#bNo').onclick=()=>{stopRing();closePhone()};
  $('#bOk').onclick=()=>{stopRing();answer()};
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function answer(){
  $('#vPhone').classList.remove('ringing');
  setPhone('00:00',[['no','✕','hang','bHang']]);
  let sec=0;tick=setInterval(()=>{$('#what').textContent=fmt(++sec)},1000);
  const {src,an}=voiceChain(window._buf,charOf(who));playing=src;
  const mouth=$('#mouth'),data=new Uint8Array(an.fftSize),base=3,max=who==='bubak'?16:12;
  const loop=()=>{an.getByteTimeDomainData(data);let s=0;for(const v of data){const x=(v-128)/128;s+=x*x}
    const lvl=Math.min(1,Math.sqrt(s/data.length)*5);mouth.setAttribute('ry',(base+lvl*max).toFixed(1));raf=requestAnimationFrame(loop)};
  loop();
  src.onended=()=>{if(playing===src)setTimeout(endCall,900)};
  src.start(ac().currentTime+0.6);
  $('#bHang').onclick=endCall;
}
function endCall(){
  if(!$('#vPhone').classList.contains('on'))return;
  try{playing&&playing.stop()}catch(e){}playing=null;
  cancelAnimationFrame(raf);clearInterval(tick);
  $('#what').textContent=t('ended');$('#acts').innerHTML='';
  setTimeout(closePhone,1800);
}
function closePhone(){$('#vPhone').classList.remove('on','ringing');wake(false)}

/* ---------- Nahrávanie ---------- */
let recWho=null,saved=null,mr=null,chunks=[],blob=null,stream=null,recLimit=0,preview=null;
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));scrollTo(0,0)}
function recUI(state){
  $('#bRec').disabled=state==='rec';$('#bStop').disabled=state!=='rec';
  $('#bPlay').disabled=!(blob||saved)||state==='rec';$('#bSave').disabled=!blob||state==='rec';
}
document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{
  recWho=b.dataset.rec;blob=null;
  $('#recTitle').textContent=t(recWho==='jezisko'?'recJ':'recB');
  $('#recTip').textContent=t(recWho==='jezisko'?'tipJ':'tipB');
  $('#recStatus').textContent='';syncSemi();recUI('idle');show('vRec');
  DB.get(recWho).then(v=>{saved=v||null;recUI('idle')}).catch(()=>{});
});
function syncSemi(){const v=getSemi(charOf(recWho));$('#semi').value=v;$('#semiV').textContent=(v>0?'+':'')+v+' '+t('st')}
$('#semi').oninput=e=>{setSemi(charOf(recWho),+e.target.value);syncSemi()};
$('#semi').onchange=()=>{if(blob||saved)$('#bPlay').click()};
$('#bRec').onclick=async()=>{
  unlock();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('#recStatus').textContent=t('noMic');return}
  chunks=[];mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});stream.getTracks().forEach(x=>x.stop());clearTimeout(recLimit);$('#recStatus').textContent=t('recDone');recUI('idle')};
  mr.start();$('#recStatus').textContent=t('recording');recUI('rec');
  recLimit=setTimeout(()=>mr.state==='recording'&&mr.stop(),60000);
};
$('#bStop').onclick=()=>mr&&mr.state==='recording'&&mr.stop();
$('#bPlay').onclick=async()=>{
  try{preview&&preview.stop()}catch(e){}
  $('#recStatus').textContent=t('working');
  await new Promise(r=>setTimeout(r,30));
  const ch=charOf(recWho),{src}=voiceChain(processVoice(await decodeBlob(blob||saved),ch),ch);
  $('#recStatus').textContent='';preview=src;src.start();
};
$('#bSave').onclick=async()=>{await DB.set(recWho,blob);saved=blob;$('#recStatus').textContent=t('saved')};
$('#bDel').onclick=async()=>{await DB.del(recWho);blob=null;saved=null;recUI('idle');$('#recStatus').textContent=t('deleted')};
$('#bBack').onclick=()=>{try{preview&&preview.stop()}catch(e){}if(mr&&mr.state==='recording')mr.stop();refreshHas();show('vHome')};

applyLang();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/volanie/sw.js',{scope:'/volanie/'}).catch(()=>{});
</script>
