<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volanie — plainkit.</title>
<meta name="description" content="Falošný hovor od Ježiška alebo Bubáka. Bez reklám, bez registrácie, nahrávky ostávajú v zariadení.">
<meta name="theme-color" content="#0a0f14">
<link rel="manifest" href="/volanie/manifest.json">
<link rel="icon" href="/volanie/icon-192.png">
<link rel="apple-touch-icon" href="/volanie/icon-192.png">
<style>
/* TODO: sem skopíruj @font-face blok pre IBM Plex Sans z inej plainkit stránky (/fonts/) */
:root{--bg:#07090f;--bg2:#0a0f14;--card:#111823;--line:#1c2633;--tx:#e6edf3;--mut:#8b98a8;--cy:#00d4e8;--ye:#ffc629;--mg:#ff3df2;--ok:#2ecc71;--no:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
a{color:var(--cy)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{color:var(--tx);text-decoration:none;font-weight:700;font-size:20px}
.logo span{color:var(--cy)}
.lang{display:flex;gap:4px}
.lang button{background:none;border:1px solid var(--line);color:var(--mut);padding:4px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{border-color:var(--cy);color:var(--cy)}
.banner{text-align:center;font-size:12px;color:var(--mut);padding:6px 16px;letter-spacing:.04em}
main{max-width:480px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.big{display:block;width:100%;padding:22px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:20px;font-weight:600;cursor:pointer;text-align:left}
.big.j{border-color:var(--ye)}.big.b{border-color:var(--mg)}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:4px}
.slot{margin-bottom:18px}
.link{background:none;border:none;color:var(--cy);font:inherit;font-size:14px;padding:8px 2px;cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
